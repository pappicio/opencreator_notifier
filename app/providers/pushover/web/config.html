<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pushover - OpenCreator</title>
    <link rel="stylesheet" href="/providers/pushover/web/config.css">
</head>
<body>
    <header class="header">
        <div class="provider-brand"><img class="oc-logo" src="/opencreator-logo.png" alt="OpenCreator"><div><h1>Pushover</h1>
            <p data-i18n="description">Send printer notifications to Pushover.</p></div></div>
        <button class="button secondary" id="backButton" data-i18n="back">Back</button>
    </header>

    <main>
        <section class="card">
            <h2 data-i18n="service_configuration">Service Configuration</h2>

            <label for="serviceName" data-i18n="service_name">Service Name</label>
            <input id="serviceName" type="text" maxlength="80" required>

            <label for="userKey" data-i18n="user_key">User Key</label>
            <div class="secret-wrap">
                <input id="userKey" type="password" maxlength="256"
                       autocomplete="off" spellcheck="false" required>
                <button type="button" class="secret-toggle" id="toggleUserKey"
                        data-i18n="show">Show</button>
            </div>

            <label for="apiToken" data-i18n="api_token">API Token</label>
            <div class="secret-wrap">
                <input id="apiToken" type="password" maxlength="256"
                       autocomplete="off" spellcheck="false" required>
                <button type="button" class="secret-toggle" id="toggleApiToken"
                        data-i18n="show">Show</button>
            </div>

            <label class="checkbox-row">
                <input id="enabled" type="checkbox">
                <span data-i18n="enabled">Enable notifications</span>
            </label>

            <div class="actions">
                <button class="button primary" id="saveButton" data-i18n="save">Save Configuration</button>
                <button class="button secondary" id="testButton" data-i18n="test" disabled>Test Notification</button>
                <button class="button secondary" id="cancelButton" data-i18n="cancel">Cancel</button>
            </div>

            <p id="notice" role="status"></p>
        </section>
    </main>

    <script src="/providers/_shared/web/config.js"></script>
    <script src="/providers/pushover/web/config.js"></script>
</body>
</html>
