<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Configuration - OpenCreator Notifier</title>
<link rel="stylesheet" href="config.css">
</head>
<body>
<main>
  <header>
    <div class="provider-brand">
<img class="oc-logo" src="/opencreator-logo.png" alt="OpenCreator">
<div><h1>Discord</h1>
      <p data-i18n="description">Configure a Discord Webhook destination</p></div>
    </div>
    <button type="button" class="secondary" id="backButton" data-i18n="back">Back</button>
  </header>
  <section class="card">
    <h2 data-i18n="service_configuration">Service Configuration</h2>
    <div class="field">
      <label for="serviceName" data-i18n="service_name">Service Name</label>
      <input id="serviceName" maxlength="80" data-i18n-placeholder="service_name_placeholder" placeholder="e.g. Workshop Discord" required>
    </div>
    <div class="field">
      <label for="webhookId" data-i18n="webhook_id">Webhook ID</label>
      <input id="webhookId" type="text" autocomplete="off" data-i18n-placeholder="webhook_id_placeholder" placeholder="Discord Webhook ID" required>
    </div>
    <div class="field">
      <label for="webhookToken" data-i18n="webhook_token">Webhook Token</label>
      <div class="token-wrap">
        <input id="webhookToken" type="password" autocomplete="off" data-i18n-placeholder="webhook_token_placeholder" placeholder="Discord Webhook Token" required>
        <button type="button" class="token-toggle" id="toggleToken" aria-label="Show Webhook token" title="Show Webhook token">👁</button>
      </div>
    </div>
    <label class="check">
      <input id="enabled" type="checkbox" checked>
      <span data-i18n="enabled">Enabled</span>
    </label>
    <div class="actions">
      <button type="button" id="saveButton" data-i18n="save">Save Configuration</button>
      <button type="button" class="secondary" id="testButton" disabled data-i18n="test">Test Notification</button>
      <button type="button" class="secondary" id="cancelButton" data-i18n="cancel">Cancel</button>
    </div>
    <p id="notice" role="status"></p>
  </section>
</main>
<script src="/providers/_shared/web/config.js"></script>
<script src="config.js"></script>
</body>
</html>
